[workspace]

[package]
name = "terra"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Requires a separately installed native engine and its reviewed startup graph.
webkit-engine = []

[dependencies]
appcore = { package = "mochios-appcore", path = "../../tools/devkit/crates/appcore" }
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "terra"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }
