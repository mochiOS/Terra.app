[workspace]

[package]
name = "terra"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Requires a separately installed native engine and its reviewed startup graph.
webkit-engine = []
# Opt-in native integration fixture; never enabled in the distributed app.
engine-probe = ["webkit-engine"]

[dependencies]
appcore = { package = "mochios-appcore", git = "https://github.com/mochiOS/devkit" }
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "terra"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }
